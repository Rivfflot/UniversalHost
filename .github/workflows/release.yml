name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Build application and project converter
        run: |
          dotnet build UniversalHost.slnx --configuration Debug

      - name: Publish Windows x64
        run: >-
          dotnet publish UniversalHost/UniversalHost.csproj
          --configuration Release
          --runtime win-x64
          --self-contained false
          -p:PublishSingleFile=true

      - name: Check parser architecture and licenses
        run: >-
          pwsh build/Verify-SymbolPackage.ps1
          -PublishDirectory UniversalHost/bin/Release/net10.0/win-x64/publish
          -Rid win-x64
          -RunWorker

      - name: Package release
        run: >-
          pwsh build/Package-Release.ps1
          -PublishDirectory UniversalHost/bin/Release/net10.0/win-x64/publish
          -Rid win-x64
          -OutputFile UniversalHost-win-x64.zip

      - name: Create draft pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" UniversalHost-win-x64.zip --draft --prerelease --title "$env:GITHUB_REF_NAME" --generate-notes
